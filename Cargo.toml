[workspace]
members = [
    "crates/chromifer-cli",
    "crates/chromifer-components",
    "crates/chromifer-evidence",
    "crates/chromifer-gn",
    "crates/chromifer-manifest",
    "crates/chromifer-owners",
    "crates/chromifer-planner",
    "crates/chromifer-source",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/fwerkor/Chromifer"
authors = ["Cao Yuhang <caoyuhang@fwerkor.com>"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
