schema_version = 1

[project]
name = "Chromifer generated gate example"
upstream = "https://github.com/fwerkor/Chromifer"
baseline = "workspace"

[[targets]]
id = "host"
description = "Current host used for generated artifact checks"
required = true

[[modules]]
id = "rust_bridge"
path = "examples/rust-bridge"
owner = "chromifer"
state = "legacy_cpp"

[[modules]]
id = "c_abi_bridge"
path = "examples/c-abi-bridge"
owner = "chromifer"
state = "legacy_cpp"

[[modules]]
id = "mojo_bridge"
path = "examples/mojo-bridge"
owner = "chromifer"
state = "legacy_cpp"

[[modules]]
id = "unsafe_policy"
path = "."
owner = "chromifer"
state = "legacy_cpp"

[[modules]]
id = "source_coverage"
path = "examples/coverage"
owner = "chromifer"
sources = [
  "examples/coverage/source/services/a/a.cc",
  "examples/coverage/source/services/a/a.h",
  "examples/coverage/source/services/b/b.cc",
]
state = "legacy_cpp"

[[modules]]
id = "multi_consumer_bridge"
path = "examples/multi-consumer-bridge"
owner = "chromifer"
sources = [
  "examples/multi-consumer-bridge/src/lib.rs",
  "examples/multi-consumer-bridge/src/alpha.rs",
  "examples/multi-consumer-bridge/src/beta.rs",
  "examples/multi-consumer-bridge/consumer/alpha.cc",
  "examples/multi-consumer-bridge/consumer/beta.cc",
]
state = "legacy_cpp"
