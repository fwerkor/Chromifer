name: Generated Contract Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Regenerate direct gates and show diff
        run: |
          cp examples/gates/generated.toml /tmp/generated.old.toml
          rm examples/gates/generated.toml
          cargo run -p chromifer -- derive-gates . examples/gates/base.toml examples/gates/gates.json examples/gates/generated.toml
          diff -u /tmp/generated.old.toml examples/gates/generated.toml || true
