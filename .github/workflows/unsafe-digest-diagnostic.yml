name: Unsafe Digest Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Regenerate unsafe report and show diff
        run: |
          cp chromifer-unsafe.json /tmp/chromifer-unsafe.old.json
          rm chromifer-unsafe.json
          cargo run -p chromifer -- audit-unsafe Cargo.toml unsafe-policy.json chromifer-unsafe.json
          diff -u /tmp/chromifer-unsafe.old.json chromifer-unsafe.json || true
