name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Measured source coverage is current
        run: |
          cargo run -p chromifer -- summarize-coverage \
            examples/coverage/manifest.toml \
            examples/coverage/source \
            examples/coverage/llvm-cov.json \
            examples/coverage/chromifer-coverage.json \
            --check
          cargo run -p chromifer -- rank-components \
            examples/coverage/manifest.toml \
            --coverage examples/coverage/chromifer-coverage.json \
            --json > /tmp/chromifer-coverage-ranking.json
          python3 -c 'import json; d=json.load(open("/tmp/chromifer-coverage-ranking.json")); c={x["id"]:x for x in d["components"]}; assert c["services_a"]["risk"]["source_coverage"] == 0; assert c["services_b"]["risk"]["source_coverage"] == 19'
      - name: Unsafe policy is current
        run: |
          cargo run -p chromifer -- audit-unsafe \
            Cargo.toml \
            unsafe-policy.json \
            chromifer-unsafe.json \
            --check
          cargo run -p chromifer -- audit-unsafe \
            examples/c-abi-bridge/Cargo.toml \
            examples/c-abi-bridge/unsafe-policy.json \
            examples/c-abi-bridge/chromifer-unsafe.json \
            --check
      - name: Generated GN bridge is current
        run: |
          cargo run -p chromifer -- generate-gn \
            examples/rust-bridge/Cargo.toml \
            examples/rust-bridge/BUILD.gn \
            --visibility //examples/rust-bridge:* \
            --check
          cargo run -p chromifer -- generate-gn \
            examples/multi-consumer-bridge/Cargo.toml \
            examples/multi-consumer-bridge/BUILD.gn \
            --gn-package-path //examples/multi-consumer-bridge \
            --consumer-contract examples/multi-consumer-bridge/consumers.json \
            --check
      - name: Generated C ABI bridge is current
        run: |
          cargo run -p chromifer -- generate-c-abi \
            examples/c-abi-bridge \
            examples/c-abi-bridge/c-abi.json \
            examples/c-abi-bridge/include/api.h \
            --check
          cargo run -p chromifer -- generate-gn \
            examples/c-abi-bridge/Cargo.toml \
            examples/c-abi-bridge/BUILD.gn \
            --gn-package-path //examples/c-abi-bridge \
            --allow-unsafe \
            --consumer-target c_abi_smoke \
            --consumer-source consumer/smoke.cc \
            --consumer-header include/api.h \
            --consumer-visibility //examples/c-abi-bridge:* \
            --check
          cargo check --manifest-path examples/c-abi-bridge/Cargo.toml
          c++ -std=c++17 -I. -fsyntax-only examples/c-abi-bridge/consumer/smoke.cc
      - name: Generated Mojo bridge is current
        run: |
          cargo run -p chromifer -- generate-mojo \
            examples/mojo-bridge \
            examples/mojo-bridge/mojo.json \
            examples/mojo-bridge/BUILD.gn \
            --check
      - name: Chromium checkout lock smoke
        run: examples/checkout/run-smoke.sh
      - name: Build pinned GN
        run: |
          examples/integration/build-pinned-gn.sh /tmp/chromifer-gn
          echo /tmp/chromifer-gn/out >> "$GITHUB_PATH"
          /tmp/chromifer-gn/out/gn format --dry-run examples/multi-consumer-bridge/BUILD.gn
      - name: Real GN endpoint integration
        run: examples/integration/run-smoke.sh
      - name: Chromium native report is consistent
        run: python3 examples/integration/verify-chromium-native-report.py
      - name: Structured contract gates pass
        run: |
          cargo run -p chromifer -- derive-gates \
            . \
            examples/gates/base.toml \
            examples/gates/gates.json \
            examples/gates/generated.toml \
            --check
          rm -rf /tmp/chromifer-gate-evidence
          revision=$(git rev-parse HEAD)
          cargo run -p chromifer -- run-gates \
            examples/gates/generated.toml \
            . \
            /tmp/chromifer-gate-evidence \
            --attest-checkout \
            --expected-revision "$revision" \
            --require-clean-checkout \
            --attest-executables \
            --json > /tmp/chromifer-gate-run.json
          evidence=$(python3 -c 'import json; print(json.load(open("/tmp/chromifer-gate-run.json"))["path"])')
          cargo run -p chromifer -- verify-evidence \
            examples/gates/generated.toml \
            "$evidence" \
            /tmp/chromifer-gate-evidence \
            --workdir .
          python3 - <<'PY'
          import os
          import secrets

          path = "/tmp/chromifer-runner.key"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii") as output:
              output.write(secrets.token_hex(32) + "\n")
          PY
          cargo run -p chromifer -- derive-attestation-public-key \
            /tmp/chromifer-runner.key \
            /tmp/chromifer-runner.pub
          cargo run -p chromifer -- derive-attestation-public-key \
            /tmp/chromifer-runner.key \
            /tmp/chromifer-runner.pub \
            --check
          cargo run -p chromifer -- sign-evidence \
            "$evidence" \
            /tmp/chromifer-runner.key \
            /tmp/chromifer-gate-evidence.sig.json \
            --runner-id "github-actions/$GITHUB_RUN_ID"
          cargo run -p chromifer -- sign-evidence \
            "$evidence" \
            /tmp/chromifer-runner.key \
            /tmp/chromifer-gate-evidence.sig.json \
            --runner-id "github-actions/$GITHUB_RUN_ID" \
            --check
          cargo run -p chromifer -- verify-evidence-signature \
            "$evidence" \
            /tmp/chromifer-gate-evidence.sig.json \
            /tmp/chromifer-runner.pub
          rm -f /tmp/chromifer-runner.key

  portable-build-bridge:
    name: Portable build bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Portable bridge tests
        run: cargo test -p chromifer-build -p chromifer-cabi -p chromifer-mojo -p chromifer-gates --all-features --locked
      - name: Generated contracts are platform-stable
        run: |
          cargo run -p chromifer -- audit-unsafe Cargo.toml unsafe-policy.json chromifer-unsafe.json --check
          cargo run -p chromifer -- summarize-coverage examples/coverage/manifest.toml examples/coverage/source examples/coverage/llvm-cov.json examples/coverage/chromifer-coverage.json --check
          cargo run -p chromifer -- generate-gn examples/rust-bridge/Cargo.toml examples/rust-bridge/BUILD.gn --visibility '//examples/rust-bridge:*' --check
          cargo run -p chromifer -- generate-gn examples/multi-consumer-bridge/Cargo.toml examples/multi-consumer-bridge/BUILD.gn --gn-package-path //examples/multi-consumer-bridge --consumer-contract examples/multi-consumer-bridge/consumers.json --check
          cargo run -p chromifer -- generate-c-abi examples/c-abi-bridge examples/c-abi-bridge/c-abi.json examples/c-abi-bridge/include/api.h --check
          cargo run -p chromifer -- generate-gn examples/c-abi-bridge/Cargo.toml examples/c-abi-bridge/BUILD.gn --gn-package-path //examples/c-abi-bridge --allow-unsafe --consumer-target c_abi_smoke --consumer-source consumer/smoke.cc --consumer-header include/api.h --consumer-visibility '//examples/c-abi-bridge:*' --check
          cargo run -p chromifer -- generate-mojo examples/mojo-bridge examples/mojo-bridge/mojo.json examples/mojo-bridge/BUILD.gn --check
          cargo run -p chromifer -- derive-gates . examples/gates/base.toml examples/gates/gates.json examples/gates/generated.toml --check
          cargo check --manifest-path examples/rust-bridge/Cargo.toml --locked
          cargo check --manifest-path examples/c-abi-bridge/Cargo.toml --locked
      - name: Compile C ABI C++ consumer (macOS)
        if: runner.os == 'macOS'
        run: c++ -std=c++17 -I. -fsyntax-only examples/c-abi-bridge/consumer/smoke.cc examples/c-abi-bridge/consumer/main.cc
      - name: Compile C ABI C++ consumer (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /I. /c examples\c-abi-bridge\consumer\smoke.cc /Fo:%TEMP%\chromifer-smoke.obj
          cl /nologo /std:c++17 /I. /c examples\c-abi-bridge\consumer\main.cc /Fo:%TEMP%\chromifer-main.obj
