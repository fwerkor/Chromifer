name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Unsafe policy is current
        run: |
          cargo run -p chromifer -- audit-unsafe \
            Cargo.toml \
            unsafe-policy.json \
            chromifer-unsafe.json \
            --check
          cargo run -p chromifer -- audit-unsafe \
            examples/c-abi-bridge/Cargo.toml \
            examples/c-abi-bridge/unsafe-policy.json \
            examples/c-abi-bridge/chromifer-unsafe.json \
            --check
      - name: Generated GN bridge is current
        run: |
          cargo run -p chromifer -- generate-gn \
            examples/rust-bridge/Cargo.toml \
            examples/rust-bridge/BUILD.gn \
            --visibility //examples/rust-bridge:* \
            --check
      - name: Generated C ABI bridge is current
        run: |
          cargo run -p chromifer -- generate-c-abi \
            examples/c-abi-bridge \
            examples/c-abi-bridge/c-abi.json \
            examples/c-abi-bridge/include/api.h \
            --check
          cargo run -p chromifer -- generate-gn \
            examples/c-abi-bridge/Cargo.toml \
            examples/c-abi-bridge/BUILD.gn \
            --gn-package-path //examples/c-abi-bridge \
            --allow-unsafe \
            --consumer-target c_abi_smoke \
            --consumer-source consumer/smoke.cc \
            --consumer-header include/api.h \
            --consumer-visibility //examples/c-abi-bridge:* \
            --check
          cargo check --manifest-path examples/c-abi-bridge/Cargo.toml
          c++ -std=c++17 -I. -fsyntax-only examples/c-abi-bridge/consumer/smoke.cc
      - name: Generated Mojo bridge is current
        run: |
          cargo run -p chromifer -- generate-mojo \
            examples/mojo-bridge \
            examples/mojo-bridge/mojo.json \
            examples/mojo-bridge/BUILD.gn \
            --check
      - name: Chromium checkout lock smoke
        run: examples/checkout/run-smoke.sh
      - name: Structured contract gates pass
        run: |
          cargo run -p chromifer -- derive-gates \
            . \
            examples/gates/base.toml \
            examples/gates/gates.json \
            examples/gates/generated.toml \
            --check
          rm -rf /tmp/chromifer-gate-evidence
          revision=$(git rev-parse HEAD)
          cargo run -p chromifer -- run-gates \
            examples/gates/generated.toml \
            . \
            /tmp/chromifer-gate-evidence \
            --attest-checkout \
            --expected-revision "$revision" \
            --require-clean-checkout \
            --attest-executables \
            --json > /tmp/chromifer-gate-run.json
          evidence=$(python3 -c 'import json; print(json.load(open("/tmp/chromifer-gate-run.json"))["path"])')
          cargo run -p chromifer -- verify-evidence \
            examples/gates/generated.toml \
            "$evidence" \
            /tmp/chromifer-gate-evidence \
            --workdir .
