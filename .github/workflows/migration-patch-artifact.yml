name: Migration Patch Artifact Binding

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bind:
    if: github.head_ref == 'm3/ukm-recorder-pilot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m3/ukm-recorder-pilot
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Bind M3 completion to exact Chromium patch artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('crates/chromifer-migration/Cargo.toml')
          text = cargo.read_text()
          old = 'serde.workspace = true\nthiserror.workspace = true\ntoml.workspace = true\n'
          new = 'serde.workspace = true\nsha2.workspace = true\nthiserror.workspace = true\ntoml.workspace = true\n'
          if old not in text:
              raise SystemExit('migration Cargo dependency anchor not found')
          cargo.write_text(text.replace(old, new, 1))

          lib = Path('crates/chromifer-migration/src/lib.rs')
          s = lib.read_text()
          old = 'use serde::Deserialize;\nuse thiserror::Error;\n'
          new = 'use serde::Deserialize;\nuse sha2::{Digest, Sha256};\nuse thiserror::Error;\n'
          if old not in s:
              raise SystemExit('sha2 import anchor not found')
          s = s.replace(old, new, 1)

          old = '''    pub upstream: Upstream,\n    pub boundary: Boundary,\n    pub rollback: Rollback,\n'''
          new = '''    pub upstream: Upstream,\n    pub boundary: Boundary,\n    pub implementation: ImplementationEvidence,\n    pub rollback: Rollback,\n'''
          if old not in s:
              raise SystemExit('pilot implementation field anchor not found')
          s = s.replace(old, new, 1)

          old = '''pub struct Rollback {\n    pub status: EvidenceStatus,\n'''
          new = '''pub struct ImplementationEvidence {\n    pub status: EvidenceStatus,\n    #[serde(default)]\n    pub patch: Option<PatchArtifact>,\n}\n\n#[derive(Debug, Clone, PartialEq, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct PatchArtifact {\n    pub path: String,\n    pub base_revision: String,\n    pub sha256: String,\n}\n\n#[derive(Debug, Clone, PartialEq, Deserialize)]\n#[serde(deny_unknown_fields)]\npub struct Rollback {\n    pub status: EvidenceStatus,\n'''
          if old not in s:
              raise SystemExit('implementation type anchor not found')
          s = s.replace(old, new, 1)

          old = '''        check_unique_nonempty(\n            "legacy source",\n            &self.pilot.boundary.legacy_sources,\n            &mut errors,\n        );\n\n        check_nonempty("rollback GN arg", &self.pilot.rollback.gn_arg, &mut errors);\n'''
          new = '''        check_unique_nonempty(\n            "legacy source",\n            &self.pilot.boundary.legacy_sources,\n            &mut errors,\n        );\n\n        self.validate_implementation(&mut errors);\n\n        check_nonempty("rollback GN arg", &self.pilot.rollback.gn_arg, &mut errors);\n'''
          if old not in s:
              raise SystemExit('implementation validation call anchor not found')
          s = s.replace(old, new, 1)

          old = '''        if self.pilot.status == PilotStatus::Complete {\n            for (name, status) in [\n'''
          new = '''        if self.pilot.status == PilotStatus::Complete {\n            if self.pilot.implementation.status != EvidenceStatus::Passed {\n                errors.push(format!(\n                    "complete pilot requires a passed implementation patch artifact; found {:?}",\n                    self.pilot.implementation.status\n                ));\n            }\n            for (name, status) in [\n'''
          if old not in s:
              raise SystemExit('complete implementation anchor not found')
          s = s.replace(old, new, 1)

          old = '''    fn validate_parity(&self, errors: &mut Vec<String>) {\n'''
          new = '''    fn validate_implementation(&self, errors: &mut Vec<String>) {\n        let Some(patch) = &self.pilot.implementation.patch else {\n            if self.pilot.implementation.status == EvidenceStatus::Passed {\n                errors.push("passed implementation evidence requires a patch artifact".to_owned());\n            }\n            return;\n        };\n\n        check_nonempty("implementation patch path", &patch.path, errors);\n        check_git_sha("implementation patch base revision", &patch.base_revision, errors);\n        check_sha256("implementation patch", &patch.sha256, errors);\n        if patch.base_revision != self.pilot.upstream.revision {\n            errors.push("implementation patch base revision does not match pilot revision".to_owned());\n        }\n        if !is_plain_patch_filename(&patch.path) {\n            errors.push(format!(\n                "implementation patch path `{}` must be a plain .patch filename",\n                patch.path\n            ));\n            return;\n        }\n\n        let path = self.directory.join(&patch.path);\n        match fs::read(&path) {\n            Ok(bytes) => {\n                let actual = format!("{:x}", Sha256::digest(bytes));\n                if actual != patch.sha256 {\n                    errors.push(format!(\n                        "implementation patch digest mismatch: expected {}, found {actual}",\n                        patch.sha256\n                    ));\n                }\n            }\n            Err(error) => errors.push(format!(\n                "failed to read implementation patch `{}`: {error}",\n                path.display()\n            )),\n        }\n    }\n\n    fn validate_parity(&self, errors: &mut Vec<String>) {\n'''
          if old not in s:
              raise SystemExit('implementation method anchor not found')
          s = s.replace(old, new, 1)

          old = '''fn is_plain_toml_filename(value: &str) -> bool {\n    let path = Path::new(value);\n    path.extension().is_some_and(|extension| extension == "toml")\n        && path\n            .components()\n            .all(|component| matches!(component, Component::Normal(_)))\n        && path.file_name().is_some_and(|file| file == path.as_os_str())\n}\n'''
          new = '''fn is_plain_toml_filename(value: &str) -> bool {\n    is_plain_filename_with_extension(value, "toml")\n}\n\nfn is_plain_patch_filename(value: &str) -> bool {\n    is_plain_filename_with_extension(value, "patch")\n}\n\nfn is_plain_filename_with_extension(value: &str, extension: &str) -> bool {\n    let path = Path::new(value);\n    path.extension().is_some_and(|actual| actual == extension)\n        && path\n            .components()\n            .all(|component| matches!(component, Component::Normal(_)))\n        && path.file_name().is_some_and(|file| file == path.as_os_str())\n}\n'''
          if old not in s:
              raise SystemExit('plain filename helper anchor not found')
          s = s.replace(old, new, 1)

          old = '''    fn linked_path_rejects_traversal() {\n        assert!(is_plain_toml_filename("parity.toml"));\n        assert!(!is_plain_toml_filename("../parity.toml"));\n        assert!(!is_plain_toml_filename("nested/parity.toml"));\n        assert!(!is_plain_toml_filename("parity.json"));\n    }\n'''
          new = '''    fn linked_path_rejects_traversal() {\n        assert!(is_plain_toml_filename("parity.toml"));\n        assert!(!is_plain_toml_filename("../parity.toml"));\n        assert!(!is_plain_toml_filename("nested/parity.toml"));\n        assert!(!is_plain_toml_filename("parity.json"));\n        assert!(is_plain_patch_filename("chromium.patch"));\n        assert!(!is_plain_patch_filename("../chromium.patch"));\n        assert!(!is_plain_patch_filename("nested/chromium.patch"));\n        assert!(!is_plain_patch_filename("chromium.diff"));\n    }\n'''
          if old not in s:
              raise SystemExit('path unit test anchor not found')
          s = s.replace(old, new, 1)
          lib.write_text(s)

          pilot = Path('migrations/services-metrics-ukm-recorder/pilot.toml')
          text = pilot.read_text()
          old = '''methods = ["AddEntry", "UpdateSourceURL"]\n\n[rollback]\n'''
          new = '''methods = ["AddEntry", "UpdateSourceURL"]\n\n[implementation]\nstatus = "pending"\n\n[rollback]\n'''
          if old not in text:
              raise SystemExit('pilot implementation TOML anchor not found')
          pilot.write_text(text.replace(old, new, 1))

          tests = Path('crates/chromifer-migration/tests/repository.rs')
          text = tests.read_text()
          text += '''\n\n#[test]\nfn implementation_cannot_pass_without_patch_artifact() {\n    let mut evidence = ukm_pilot();\n    evidence.pilot.implementation.status = chromifer_migration::EvidenceStatus::Passed;\n    let errors = evidence\n        .validate()\n        .expect_err("implementation cannot pass without an exact patch artifact");\n    assert!(errors\n        .0\n        .iter()\n        .any(|error| error == "passed implementation evidence requires a patch artifact"));\n}\n\n#[test]\nfn complete_pilot_requires_passed_patch_artifact() {\n    let mut evidence = ukm_pilot();\n    evidence.pilot.status = PilotStatus::Complete;\n    let errors = evidence\n        .validate()\n        .expect_err("complete M3 pilot must require an exact patch artifact");\n    assert!(errors\n        .0\n        .iter()\n        .any(|error| error.contains("complete pilot requires a passed implementation patch artifact")));\n}\n'''
          tests.write_text(text)

          cli = Path('crates/chromifer-cli/src/main.rs')
          text = cli.read_text()
          old = '''                "valid migration {}: status={:?}, revision={}, parity={:?}, performance={:?}, exposure={:?}, rollback={:?}",\n                evidence.pilot.id,\n                evidence.pilot.status,\n                evidence.pilot.upstream.revision,\n                evidence.pilot.m3_acceptance.feature_parity,\n'''
          new = '''                "valid migration {}: status={:?}, revision={}, implementation={:?}, parity={:?}, performance={:?}, exposure={:?}, rollback={:?}",\n                evidence.pilot.id,\n                evidence.pilot.status,\n                evidence.pilot.upstream.revision,\n                evidence.pilot.implementation.status,\n                evidence.pilot.m3_acceptance.feature_parity,\n'''
          if old not in text:
              raise SystemExit('CLI implementation status anchor not found')
          cli.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p chromifer-migration --locked
          cargo run -p chromifer -- validate-migration migrations/services-metrics-ukm-recorder
          cargo clippy -p chromifer -p chromifer-migration --all-targets --locked -- -D warnings
          cargo run -p chromifer -- audit-unsafe Cargo.toml unsafe-policy.json chromifer-unsafe.json --force
          cargo run -p chromifer -- derive-gates . examples/gates/base.toml examples/gates/gates.json examples/gates/generated.toml --force
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/chromifer-cli crates/chromifer-migration migrations/services-metrics-ukm-recorder/pilot.toml chromifer-unsafe.json examples/gates/generated.toml
          git commit -m "m3: bind completion to exact Chromium patch artifact"
          git push origin HEAD:m3/ukm-recorder-pilot
